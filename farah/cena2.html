<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Farah Reels v2</title>
<link rel="stylesheet" href="marca/marca.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--grafite); }
  body { font-family: var(--f-texto); color: var(--branco); -webkit-font-smoothing: antialiased; }
  #palco { position: absolute; inset: 0; overflow: hidden; }
  #cam { position: absolute; inset: 0; will-change: transform; }
  .beat { position: absolute; inset: 0; display: none; overflow: hidden; will-change: transform; }
  .beat.on { display: block; }
  .fundo { position: absolute; inset: 0; }
  .f-grafite { background: radial-gradient(110% 60% at 50% 42%, #24262A 0%, var(--grafite) 70%); }
  .f-ouro { background: radial-gradient(120% 70% at 50% 40%, #D8A84E 0%, var(--ouro) 60%, #B98832 100%); }
  .foto { position: absolute; inset: -3%; width: 106%; height: 106%; object-fit: cover; will-change: transform; }
  .veu { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,24,26,.35) 0%, rgba(23,24,26,.62) 30%, rgba(23,24,26,.7) 60%, rgba(23,24,26,.5) 100%); }
  .grade { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(201,151,63,.10) 2px, transparent 2px), linear-gradient(90deg, rgba(201,151,63,.10) 2px, transparent 2px);
    background-size: 120px 120px; }

  /* área segura: 80px laterais, 250 topo, 350 base */
  .seguro { position: absolute; left: 80px; right: 80px; top: 250px; bottom: 350px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .linha { display: flex; justify-content: center; gap: 0.22em; white-space: nowrap; line-height: .95;
    font-family: var(--f-titulo); font-weight: 900; font-stretch: 125%; text-transform: uppercase; letter-spacing: -0.02em; }
  .linha + .linha { margin-top: 0.06em; }
  .linha.leve { font-weight: 700; font-stretch: 112%; letter-spacing: 0; }
  .p { display: inline-block; position: relative; will-change: transform, opacity; }
  .p.ouro { color: var(--ouro); }
  .p.escuro { color: var(--grafite); }
  .p.bloco { color: var(--grafite); padding: 0 0.12em; }
  .p.bloco::before { content: ''; position: absolute; inset: 0.04em -0.02em 0.02em; background: var(--ouro);
    z-index: -1; transform-origin: left center; transform: scaleX(var(--k, 1)); border-radius: 0.06em; }
  .p.bloco.claro::before { background: var(--branco); }
  .sombra .p { text-shadow: 0 6px 40px rgba(0,0,0,.45); }

  /* produtos */
  .fantasma { position: absolute; left: 0; white-space: nowrap; font-family: var(--f-titulo); font-weight: 900;
    font-stretch: 125%; font-size: 300px; line-height: 1; text-transform: uppercase; color: transparent;
    -webkit-text-stroke: 3px rgba(244,242,238,.16); will-change: transform; }
  .f-ouro + .fantasmas .fantasma { -webkit-text-stroke-color: rgba(23,24,26,.16); }
  .prod { position: absolute; left: 50%; top: 760px; width: 0; height: 0; will-change: transform; }
  .prod img { position: absolute; transform: translate(-50%, -50%); filter: drop-shadow(0 40px 50px rgba(0,0,0,.45)); }
  .rotulo { position: absolute; left: 80px; right: 80px; top: 1170px; display: flex; flex-direction: column; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 14px; padding: 12px 26px; border-radius: 999px;
    font-family: var(--f-texto); font-weight: 800; font-stretch: 110%; font-size: 30px; letter-spacing: .18em;
    background: var(--grafite); color: var(--ouro); margin-bottom: 22px; will-change: transform, opacity; }
  .f-grafite ~ .rotulo .chip { background: var(--ouro); color: var(--grafite); }
  .contador { position: absolute; top: 270px; right: 80px; font-family: var(--f-texto); font-weight: 800; font-stretch: 110%;
    font-size: 30px; letter-spacing: .12em; opacity: .7; }

  /* selo fixo com endereço */
  #selo { position: absolute; left: 50%; top: 1468px; transform: translateX(-50%); display: flex; align-items: center; gap: 18px;
    padding: 12px 30px 12px 12px; border-radius: 999px; background: rgba(23,24,26,.92); border: 2px solid rgba(201,151,63,.7);
    font-family: var(--f-texto); font-weight: 700; font-stretch: 108%; font-size: 32px; letter-spacing: .04em; color: var(--branco);
    white-space: nowrap; will-change: transform, opacity; z-index: 5; }
  #selo .mono { font-size: 64px; }
  #selo em { font-style: normal; color: var(--ouro); }

  .pin { width: 120px; height: 120px; margin-bottom: 30px; will-change: transform; }
  .mini { position: absolute; will-change: transform, opacity; filter: drop-shadow(0 20px 24px rgba(0,0,0,.5)); }

  /* tela final */
  .final .seguro { justify-content: space-between; padding: 90px 0 10px; }
  .final .el { will-change: transform, opacity; display: flex; flex-direction: column; align-items: center; }
  .final .end { font-family: var(--f-texto); font-weight: 700; font-stretch: 105%; font-size: 46px; line-height: 1.25; white-space: nowrap; }
  .final .end span { display: block; color: var(--areia); font-weight: 600; font-size: 36px; }
  .final .zap { background: var(--ouro); color: var(--grafite); border-radius: 28px; padding: 26px 50px 32px; }
  .final .zap .rot { font-weight: 800; font-stretch: 110%; font-size: 30px; letter-spacing: .3em; margin-right: -.3em; }
  .final .zap .num { font-family: var(--f-titulo); font-weight: 900; font-stretch: 112%; font-size: 82px; letter-spacing: -0.02em; white-space: nowrap; margin-top: 4px; }
  .final .insta { font-weight: 700; font-stretch: 105%; font-size: 40px; color: var(--branco); white-space: nowrap; }
  .final .el.cta { display: block; }
  .final .cta { font-family: var(--f-titulo); font-weight: 900; font-stretch: 125%; font-size: 96px; line-height: 1;
    text-transform: uppercase; letter-spacing: -0.02em; white-space: nowrap; }
  .final .cta i { font-style: normal; color: var(--ouro); }

  .flash { position: absolute; inset: 0; background: var(--branco); opacity: 0; pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<div id="palco"><div id="cam"></div>
  <div id="selo"><span class="mono"><b>F</b></span><span>AV. IPEROIG, 301 <em>·</em> CENTRO</span></div>
  <div class="flash" id="flash"></div>
</div>
<script>
const D = window.DATA;               // {palavras, fotos, produtos, fps}
const FPS = D.fps || 30;
const W = i => D.palavras[i].start - 1 / FPS;     // corte 1 quadro antes da palavra
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const cam = document.getElementById('cam');
const LOGO = (cls = '', tag = false) => `<div class="logo ${cls}"><div class="wm">FAR<span class="sol">A</span>H</div>${tag ? '<div class="tag">BANCA E TABACARIA</div>' : ''}</div>`;

// palavra: [índice, texto na tela, estilo]
const P = (i, txt, st = '') => ({ i, txt, st });
const linha = (tam, ps, cls = '') => ({ tam, ps, cls });

const PRODUTOS = [
  { i: 16, nome: ['BEBIDA', 'GELADA'], extra: 17, img: 'bebida', h: 640, fundo: 'ouro' },
  { i: 18, nome: ['REFRI'], img: 'refri', h: 620, fundo: 'grafite' },
  { i: 19, nome: ['ENERGÉTICO'], img: 'energetico', h: 660, fundo: 'ouro' },
  { i: 20, nome: ['DOCES'], img: 'doces', w: 720, fundo: 'grafite', rot: -14 },
  { i: 21, nome: ['CHINELO'], img: 'chinelo', h: 600, fundo: 'ouro' },
  { i: 22, nome: ['BONÉ'], img: 'bone', w: 700, fundo: 'grafite' },
  { i: 23, nome: ['CARREGADOR'], img: 'carregador', w: 680, fundo: 'ouro' },
];

const BEATS = [
  { de: 0, ate: 2, fundo: { foto: 'praia_hook' }, sombra: true, impacto: [0],
    linhas: [linha(230, [P(0, 'ATENÇÃO,')]), linha(230, [P(1, 'UBATUBA!', 'bloco')])] },
  { de: 2, ate: 7, fundo: { foto: 'praia_dor' }, sombra: true,
    linhas: [linha(130, [P(2, 'VOCÊ'), P(3, 'QUE'), P(4, 'TÁ')]), linha(200, [P(5, 'NA'), P(6, 'PRAIA', 'ouro')])] },
  { de: 7, ate: 13, fundo: 'grafite', impacto: [10],
    linhas: [linha(84, [P(7, 'E'), P(8, 'PERCEBEU'), P(9, 'QUE')], 'leve'), linha(270, [P(10, 'FALTOU', 'bloco')]),
             linha(124, [P(11, 'ALGUMA'), P(12, 'COISA?')])] },
  { de: 13, ate: 16, fundo: 'ouro', logo: 15, impacto: [15],
    linhas: [linha(120, [P(13, 'PASSA', 'escuro'), P(14, 'NA', 'escuro')])] },
  ...PRODUTOS.map((p, k) => ({ de: p.i, ate: (PRODUTOS[k + 1] || { i: 24 }).i, prod: p, n: k, fundo: p.fundo })),
  { de: 24, ate: 28, fundo: 'grafite', vitrine: true, impacto: [27],
    linhas: [linha(120, [P(24, 'AQUI'), P(25, 'TEM'), P(26, 'DE')]), linha(260, [P(27, 'TUDO!', 'bloco')])] },
  { de: 28, ate: 33, fundo: { foto: 'praia_perto' }, sombra: true, pin: 30,
    linhas: [linha(250, [P(30, 'PERTINHO', 'ouro')]), linha(150, [P(31, 'DA'), P(32, 'PRAIA')])] },
  { de: 33, ate: 40, fundo: 'grafite', grade: true, semSelo: true, impacto: [35],
    linhas: [linha(120, [P(33, 'AVENIDA')], 'leve'), linha(170, [P(34, 'IPEROIG')]), linha(380, [P(35, '301', 'ouro')]),
             linha(84, [P(38, 'CENTRO'), P(39, '· UBATUBA', 'ouro')], 'leve')] },
  { de: 40, ate: 43, fundo: 'ouro', impacto: [40],
    linhas: [linha(250, [P(40, 'FALTOU', 'escuro')]), linha(116, [P(41, 'ALGUMA', 'escuro'), P(42, 'COISA?', 'escuro')])] },
  { de: 43, ate: 46, fundo: 'grafite', logo: 44, impacto: [45],
    linhas: [linha(120, [P(43, 'A')], 'leve')], depois: [linha(240, [P(45, 'TEM!', 'bloco')])] },
  { de: 46, ate: null, final: true, fundo: 'grafite', semSelo: true },
];

function fundoHTML(f) {
  if (typeof f === 'object') return `<div class="fundo f-grafite"></div><img class="foto" src="${D.fotos[f.foto]}"><div class="veu"></div>`;
  return `<div class="fundo f-${f}"></div>`;
}
function linhasHTML(ls) {
  return ls.map(l => `<div class="linha ${l.cls}" data-tam="${l.tam}">${l.ps.map(p =>
    `<span class="p ${p.st}" data-i="${p.i}">${p.txt}</span>`).join('')}</div>`).join('');
}

const beats = BEATS.map((b, k) => {
  const el = document.createElement('div');
  el.className = 'beat' + (b.final ? ' final' : '') + (b.sombra ? ' sombra' : '');
  let h = fundoHTML(b.fundo);
  if (b.grade) h += '<div class="grade"></div>';
  if (b.prod) {
    const p = b.prod, nome = p.nome.join(' ');
    h += `<div class="fantasmas">${[0, 1, 2].map(r => `<div class="fantasma" style="top:${300 + r * 330}px">${(nome + ' · ').repeat(4)}</div>`).join('')}</div>`;
    h += `<div class="prod"><img src="${D.produtos[p.img]}" style="${p.h ? 'height:' + p.h + 'px' : 'width:' + p.w + 'px'}"></div>`;
    h += `<div class="contador">${String(b.n + 1).padStart(2, '0')}/07</div>`;
    h += `<div class="rotulo"><div class="chip">TEM NA FARAH</div>${linhasHTML([linha(p.nome.length > 1 ? 150 : 190,
      p.nome.map((t, j) => P(j ? p.extra : p.i, t, b.fundo === 'ouro' ? 'escuro' : '')))])}</div>`;
  } else if (b.final) {
    h += `<div class="seguro">
      <div class="el">${LOGO('', true)}</div>
      <div class="el end">Av. Iperoig, 301<span>Centro · Ubatuba · pertinho da praia</span></div>
      <div class="el zap"><div class="rot">WHATSAPP</div><div class="num">(11) 99745-7700</div></div>
      <div class="el insta">@banca_farah_ubatuba</div>
      <div class="el cta">PASSA <i>AQUI!</i></div></div>`;
  } else {
    let miolo = '';
    if (b.pin) miolo += `<svg class="pin" viewBox="0 0 24 24" fill="#C9973F"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.7" fill="#17181A"/></svg>`;
    miolo += linhasHTML(b.linhas || []);
    if (b.logo) miolo += `<div class="logoBox" style="margin-top:80px">${LOGO(b.fundo === 'ouro' ? 'sobre-ouro' : '')}</div>`;
    if (b.depois) miolo += `<div style="margin-top:20px">${linhasHTML(b.depois)}</div>`;
    h += `<div class="seguro">${miolo}</div>`;
    if (b.vitrine) h += Object.keys(D.produtos).map((k, j) => `<img class="mini" data-j="${j}" src="${D.produtos[k]}">`).join('');
  }
  el.innerHTML = h;
  cam.appendChild(el);
  return { b, el, de: W(b.de), ate: b.ate == null ? Infinity : W(b.ate),
    ps: [...el.querySelectorAll('.p')].map(s => ({ s, t: W(+s.dataset.i) })),
    foto: el.querySelector('.foto'), prod: el.querySelector('.prod'), fant: [...el.querySelectorAll('.fantasma')],
    chip: el.querySelector('.chip'), logo: el.querySelector('.logoBox .logo'), pin: el.querySelector('.pin'),
    minis: [...el.querySelectorAll('.mini')], els: [...el.querySelectorAll('.final .el')] };
});

// tamanhos: cada linha no maior corpo que caiba em 900px (texto) sem passar do tamanho pedido
function medir() {
  beats.forEach(o => {
    o.el.classList.add('on');
    o.el.querySelectorAll('.linha').forEach(l => {
      let s = +l.dataset.tam; l.style.fontSize = s + 'px';
      while (l.scrollWidth > 830 && s > 40) { s -= 4; l.style.fontSize = s + 'px'; }
    });
    const ajustaLogo = (lg, max) => { let s = max; lg.style.fontSize = s + 'px';
      while (lg.querySelector('.wm').scrollWidth > 840 && s > 40) { s -= 4; lg.style.fontSize = s + 'px'; } };
    if (o.logo) ajustaLogo(o.logo, 240);
    o.el.querySelectorAll('.final .num, .final .cta').forEach(e => {
      let s = parseFloat(getComputedStyle(e).fontSize);
      while (e.scrollWidth > (e.classList.contains('num') ? 760 : 840) && s > 30) { s -= 2; e.style.fontSize = s + 'px'; } });
    const lf = o.el.querySelector('.final .logo'); if (lf) ajustaLogo(lf, 200);
    // vitrine: miniaturas em volta do texto
    o.minis.forEach((m, j) => {
      const pos = [[230, 420], [540, 360], [850, 430], [250, 1260], [420, 1330], [660, 1320], [880, 1250]][j];
      const r = m.naturalWidth / m.naturalHeight, h = r > 1.3 ? 120 : 200;
      m.style.height = h + 'px'; m.style.left = (pos[0] - h * r / 2) + 'px'; m.style.top = (pos[1] - h / 2) + 'px';
      m.dataset.rot = [-12, 8, -6, 10, -8, 12, -10][j];
    });
    o.el.classList.remove('on');
  });
}

const flash = document.getElementById('flash'), selo = document.getElementById('selo');
let atual = null;
window.renderAt = function (t) {
  const o = beats.find(o => t >= o.de && t < o.ate) || beats[beats.length - 1];
  if (atual !== o) { if (atual) atual.el.classList.remove('on'); o.el.classList.add('on'); atual = o; }
  const lt = t - o.de, b = o.b;

  // entrada do beat: produtos chegam deslizando; os outros, corte seco com flash curto
  if (b.prod) {
    const x = eo(lt / 0.16);
    o.el.style.transform = `translateX(${(1 - x) * 340}px)`;
    o.el.style.filter = x < 1 ? `blur(${(1 - x) * 14}px)` : 'none';
    flash.style.opacity = 0;
  } else {
    o.el.style.transform = 'none'; o.el.style.filter = 'none';
    flash.style.opacity = 0.22 * (1 - clamp(lt / 0.1));
  }

  // tremida de câmera nas palavras de impacto
  let sx = 0, sy = 0, sc = 1;
  (b.impacto || []).forEach(i => {
    const d = t - W(i);
    if (d >= 0 && d < 0.22) { const a = (1 - d / 0.22) * 16; sx += Math.sin(d * 95) * a; sy += Math.cos(d * 70) * a * 0.6; sc += 0.03 * (1 - d / 0.22); }
  });
  cam.style.transform = `translate(${sx}px, ${sy}px) scale(${sc})`;

  if (o.foto) o.foto.style.transform = `scale(${1.12 - 0.08 * eo(lt / 0.35) + 0.015 * lt})`;

  // palavras entram no tempo da fala
  o.ps.forEach(({ s, t: tw }) => {
    const d = t - tw;
    if (d < 0) { s.style.opacity = 0; s.style.setProperty('--k', 0); return; }
    const k = back(d / 0.2);
    s.style.opacity = clamp(d / 0.05);
    s.style.transform = `translateY(${(1 - eo(d / 0.16)) * 40}px) scale(${0.7 + 0.3 * k})`;
    s.style.setProperty('--k', eo((d - 0.03) / 0.14));
  });

  if (b.prod) {
    const k = back(lt / 0.32);
    const flutua = Math.sin(lt * 3.2) * 10;
    o.prod.style.transform = `translateY(${flutua + (1 - eo(lt / 0.25)) * 120}px) rotate(${(b.prod.rot || 0) + (1 - k) * -18 + Math.sin(lt * 2.4) * 2}deg) scale(${0.55 + 0.45 * k})`;
    o.fant.forEach((f, r) => f.style.transform = `translateX(${(r % 2 ? -1 : 1) * (lt * 260 + 200) - (r % 2 ? 0 : 1400)}px)`);
    const c = back(lt / 0.2);
    o.chip.style.opacity = clamp(lt / 0.05);
    o.chip.style.transform = `scale(${0.6 + 0.4 * c})`;
  }
  if (o.logo) {
    const d = t - W(b.logo);
    o.logo.style.opacity = d < 0 ? 0 : clamp(d / 0.05);
    o.logo.style.transform = `scale(${d < 0 ? 0.6 : 0.6 + 0.4 * back(d / 0.26)})`;
    o.logo.style.setProperty('--sol', d < 0.12 ? 0 : back((d - 0.12) / 0.25));
  }
  if (o.pin) {
    const d = t - W(b.pin);
    o.pin.style.opacity = d < -0.15 ? 0 : 1;
    o.pin.style.transform = `translateY(${-(1 - back((d + 0.15) / 0.3)) * 220}px)`;
  }
  o.minis.forEach(m => {
    const d = lt - (+m.dataset.j) * 0.07;
    m.style.opacity = clamp(d / 0.06);
    m.style.transform = `scale(${d < 0 ? 0 : back(d / 0.25)}) rotate(${+m.dataset.rot + Math.sin(lt * 3 + +m.dataset.j) * 3}deg)`;
  });
  if (b.final) {
    o.els.forEach((e, k) => {
      const at = k === o.els.length - 1 ? W(50) - o.de : k * 0.08;
      const d = lt - at;
      e.style.opacity = clamp(d / 0.06);
      e.style.transform = `translateY(${(1 - eo(d / 0.2)) * 40}px) scale(${d < 0 ? 0.8 : 0.8 + 0.2 * back(d / 0.25)})`;
    });
    const lf = o.el.querySelector('.final .logo'); if (lf) lf.style.setProperty('--sol', back((lt - 0.15) / 0.3));
    const cta = o.els[o.els.length - 1], d = lt - (W(50) - o.de);
    if (d > 0.3) cta.style.transform = `scale(${1 + 0.035 * Math.sin((d - 0.3) * Math.PI * 2.2)})`;
  }

  // selo com o endereço: aparece cedo e fica até a tela final
  const sv = t >= W(2) && !b.semSelo;
  const ds = t - W(2);
  selo.style.opacity = sv ? clamp(ds / 0.15) : 0;
  selo.style.transform = `translateX(-50%) translateY(${sv ? (1 - eo(ds / 0.25)) * 60 : 0}px)`;
};
window.PRONTO = Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))
  .then(() => document.fonts.ready).then(() => { medir(); renderAt(0); return true; });
</script>
</body>
</html>
