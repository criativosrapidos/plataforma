name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aviso
          POSTGRES_PASSWORD: aviso
          POSTGRES_DB: aviso
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aviso" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://aviso:aviso@localhost:5432/aviso
      AUTH_SECRET: ci-segredo-com-tamanho-suficiente-para-jwt
      CRON_SECRET: ci
      APP_URL: http://localhost:3000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate && npm run db:seed
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/mobile/package.json') != '' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
