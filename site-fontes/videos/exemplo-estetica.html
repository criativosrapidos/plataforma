<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Exemplo · estética (marca fictícia Lume)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --sand: #F3ECE1; --deep: #1F3A2E; --sage: #9CAF92; --white: #FFFFFF; --clay: #C98B6B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--sand); font-family: Inter, sans-serif; color: var(--deep); }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .sc { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .abs { position: absolute; }
  .serif { font-family: Fraunces, Georgia, serif; font-weight: 400; letter-spacing: -.015em; }
  .logo { display: flex; align-items: baseline; gap: 14px; font-family: Fraunces; font-size: 64px; }
  .logo small { font-family: Inter; font-weight: 700; font-size: 24px; letter-spacing: .4em; }
  .sun { border-radius: 50%; }

  #s1 { background: var(--sand); }
  #s1 .sun { left: 540px; top: 760px; width: 900px; height: 900px; margin: -450px 0 0 -450px; background: radial-gradient(circle at 40% 35%, #E9D3BF, #D9B79B 60%, #C98B6B); }
  #s1 .logo { left: 50%; top: 170px; transform: translateX(-50%); }
  #s1 .l1 { left: 90px; right: 90px; top: 1280px; font-size: 150px; line-height: 1; }
  #s1 .l2 { left: 90px; right: 90px; top: 1440px; font-size: 150px; line-height: 1; font-style: italic; color: var(--clay); }

  #s2 { background: var(--deep); color: var(--sand); }
  #s2 .leaf { width: 260px; height: 520px; border-radius: 0 100% 0 100%; background: var(--sage); opacity: .9; transform-origin: 0 100%; }
  #s2 .t { left: 90px; right: 90px; top: 480px; font-size: 140px; line-height: 1.02; }
  #s2 .t i { color: var(--sage); }
  #s2 .it { left: 90px; display: flex; align-items: center; gap: 28px; font-weight: 700; font-size: 54px; }
  #s2 .it b { width: 74px; height: 74px; border-radius: 50%; background: var(--sage); display: grid; place-items: center; flex: none; }
  #s2 .it svg { width: 40px; height: 40px; }

  #s3 { background: var(--sage); }
  #s3 .min { left: 90px; top: 430px; font-weight: 800; font-size: 50px; letter-spacing: .2em; }
  #s3 .pr { left: 70px; top: 500px; font-size: 420px; line-height: 1; white-space: nowrap; }
  #s3 .pr small { font-size: 140px; margin-right: 18px; }
  #s3 .ses { left: 90px; top: 1000px; font-size: 90px; font-style: italic; }
  #s3 .ring { left: 640px; top: 1180px; width: 380px; height: 380px; border-radius: 50%; border: 14px solid var(--deep); display: grid; place-items: center; font-family: Fraunces; font-size: 120px; }
  #s3 .ring small { font-family: Inter; font-weight: 800; font-size: 30px; letter-spacing: .2em; display: block; text-align: center; margin-top: -10px; }

  #s4 { background: var(--sand); }
  #s4 .g1 { left: 0; right: 0; top: 560px; text-align: center; font-size: 150px; line-height: 1.04; }
  #s4 .g1 i { color: var(--clay); }
  #s4 .btn { left: 50%; top: 1060px; background: var(--deep); color: var(--sand); font-weight: 800; font-size: 54px; padding: 38px 72px; border-radius: 99px; white-space: nowrap; }
  #s4 .logo { left: 50%; top: 1600px; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="stage">
  <section class="sc" id="s1">
    <div class="abs sun" id="a0"></div>
    <div class="abs logo" id="a1">lume<small>ESTÉTICA</small></div>
    <div class="abs serif l1" id="a2">Sua pele</div>
    <div class="abs serif l2" id="a3">merece uma pausa.</div>
  </section>

  <section class="sc" id="s2">
    <div class="abs leaf" id="lf1" style="left:760px;top:1300px"></div>
    <div class="abs leaf" id="lf2" style="left:860px;top:1380px;background:#7F9676"></div>
    <div class="abs serif t" id="b1">Limpeza de pele <i>profunda</i></div>
    <div class="abs it" id="b2" style="top:1010px"><b><svg viewBox="0 0 24 24" fill="none" stroke="#1F3A2E" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></b>Extração cuidadosa</div>
    <div class="abs it" id="b3" style="top:1130px"><b><svg viewBox="0 0 24 24" fill="none" stroke="#1F3A2E" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></b>Máscara calmante</div>
    <div class="abs it" id="b4" style="top:1250px"><b><svg viewBox="0 0 24 24" fill="none" stroke="#1F3A2E" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></b>Hidratação</div>
  </section>

  <section class="sc" id="s3">
    <div class="abs min" id="c1">SESSÃO COMPLETA</div>
    <div class="abs serif pr" id="c2"><small>R$</small>99</div>
    <div class="abs serif ses" id="c3">pra você sair renovada</div>
    <div class="abs ring" id="c4"><div>60<small>MIN</small></div></div>
  </section>

  <section class="sc" id="s4">
    <div class="abs serif g1" id="d1">Reserve seu<br><i>horário</i></div>
    <div class="abs btn" id="d2">Agende pelo WhatsApp</div>
    <div class="abs logo" id="d3">lume<small>ESTÉTICA</small></div>
  </section>
</div>
<script>
  const DURATION = 15;
  window.DURATION = DURATION;
  window.POSTER = 9.6;
  const $ = id => document.getElementById(id);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const p = (t, a, d) => clamp((t - a) / d);
  const out3 = x => 1 - Math.pow(1 - x, 3);
  const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const back = x => { const c = 1.3, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const set = (el, o, tr) => { el.style.opacity = o; if (tr != null) el.style.transform = tr; };
  const rise = (el, t, a, d = 0.9, dist = 70, pre = '') => { const k = out3(p(t, a, d)); set(el, k, `${pre} translateY(${(1 - k) * dist}px)`); };

  const CENAS = [['s1', 0, 3.4], ['s2', 3.4, 8.2], ['s3', 8.2, 11.8], ['s4', 11.8, 15]];

  window.render = function (t) {
    CENAS.forEach(([id, a, b], i) => {
      const el = $(id), last = i === CENAS.length - 1;
      el.style.visibility = (t >= a && (last || t < b + 1)) ? 'visible' : 'hidden';
      el.style.zIndex = i + 1;
      // entrada suave em círculo, com fade
      const r = io(p(t, a, 1));
      el.style.clipPath = i === 0 ? 'none' : `circle(${r * 130}% at 50% 100%)`;
    });

    const ks = io(p(t, 0, 2.2));
    set($('a0'), 1, `scale(${0.2 + 0.8 * ks}) translateY(${Math.sin(t * 1.2) * 14}px)`);
    rise($('a1'), t, 0.3, 0.9, 20, 'translateX(-50%)');
    rise($('a2'), t, 0.8, 1, 60);
    rise($('a3'), t, 1.3, 1, 60);

    const a = 3.4;
    [['lf1', 0.5, -18], ['lf2', 0.8, 12]].forEach(([id, d, r]) => {
      const k = out3(p(t, a + d, 1.2));
      set($(id), k, `rotate(${r + Math.sin((t - a) * 1.4) * 4}deg) scale(${k})`);
    });
    rise($('b1'), t, a + 0.6, 1, 60);
    [['b2', 1.4], ['b3', 1.75], ['b4', 2.1]].forEach(([id, d]) => rise($(id), t, a + d, 0.8, 40));

    const c = 8.2;
    rise($('c1'), t, c + 0.5, 0.8, 30);
    rise($('c2'), t, c + 0.7, 1, 90);
    rise($('c3'), t, c + 1.2, 0.9, 40);
    const kr = back(p(t, c + 1.5, 0.7));
    set($('c4'), kr > 0 ? 1 : 0, `scale(${kr}) rotate(${(1 - kr) * -40}deg)`);

    const d = 11.8;
    rise($('d1'), t, d + 0.5, 1, 60);
    const kb = p(t, d + 1.1, 0.6);
    const pulse = t > d + 1.8 ? 1 + Math.sin((t - d - 1.8) * 4) * 0.025 : 1;
    set($('d2'), kb > 0 ? 1 : 0, `translateX(-50%) scale(${back(kb) * pulse})`);
    rise($('d3'), t, d + 1.5, 0.8, 20, 'translateX(-50%)');
  };
  render(0);
</script>
</body>
</html>
