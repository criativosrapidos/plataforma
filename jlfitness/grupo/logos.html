<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Anton; src: url(../fonts/anton-latin-400-normal.woff); }
@font-face { font-family: M; font-weight: 500; src: url(../fonts/montserrat-latin-500-normal.woff); }
@font-face { font-family: M; font-weight: 800; src: url(../fonts/montserrat-latin-800-normal.woff); }
@font-face { font-family: M; font-weight: 900; src: url(../fonts/montserrat-latin-900-normal.woff); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; font-family:M; }
.A { font-family:Anton; text-transform:uppercase; line-height:1; }
.box { position:relative; overflow:hidden; margin-bottom:20px; }
.cr { display:inline-flex; align-items:center; gap:12px; }
.cr .ic { background:#FFD400; border-radius:14px; display:flex; align-items:center; justify-content:center; }
</style></head><body>

<!-- 1. foto do grupo (WhatsApp corta em círculo) -->
<div class="box" id="g" style="width:1000px;height:1000px;background:#FFE100">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 30px,transparent 30px 60px)"></div>
  <div style="position:absolute;left:0;right:0;top:215px;text-align:center"><img src="../assets/silhueta.png" style="width:380px"></div>
  <div class="A" style="position:absolute;left:0;right:0;top:520px;text-align:center;font-size:170px;color:#0B0B0B">JL FITNESS</div>
  <div style="position:absolute;left:0;right:0;top:720px;text-align:center;transform:scale(1.35);transform-origin:center top">
    <div class="cr" style="background:#0B0B0B;border-radius:60px;padding:14px 34px 14px 16px">
      <div class="ic" style="width:66px;height:66px"><svg viewBox="0 0 40 40" style="width:44px"><g fill="#0B0B0B"><rect x="4" y="12" width="9" height="3.2" rx="1.6"/><rect x="2" y="18.4" width="11" height="3.2" rx="1.6"/><rect x="4" y="24.8" width="9" height="3.2" rx="1.6"/><path d="M16 9 L35 20 L16 31 Z"/></g></svg></div>
      <div style="text-align:left;line-height:1.02"><div style="font-weight:500;font-size:30px;color:#fff">× criativos</div><div style="font-weight:900;font-style:italic;font-size:32px;color:#FFD400">rápidos</div></div>
    </div>
  </div>
</div>

<!-- 2. logo horizontal JL (fundo transparente) -->
<div class="box" id="h" style="display:inline-block;padding:10px">
  <div style="display:inline-flex;align-items:stretch;border:5px solid #0B0B0B;border-radius:27px">
    <div style="width:190px;height:170px;background:#FFE100;border-radius:22px 0 0 22px;display:flex;align-items:center;justify-content:center"><img src="../assets/silhueta.png" style="width:160px"></div>
    <div style="display:flex;flex-direction:column;justify-content:center;background:#fff;border-radius:0 22px 22px 0;padding:0 34px 0 26px">
      <div class="A" style="font-size:104px;color:#0B0B0B">JL FITNESS</div>
      <div style="background:#0B0B0B;color:#fff;font-weight:800;font-size:25px;letter-spacing:.24em;padding:6px 16px;margin-top:4px;transform:skewX(-12deg)"><span style="display:inline-block;transform:skewX(12deg)">ASSESSORIA ESPORTIVA</span></div>
    </div></div>
</div>

<!-- 3. selo redondo JL (perfil Instagram) -->
<div class="box" id="s" style="width:1000px;height:1000px;border-radius:50%;background:#FFE100;border:36px solid #0B0B0B;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <img src="../assets/silhueta.png" style="width:500px;margin-top:20px"><div class="A" style="font-size:150px;color:#0B0B0B;margin-top:20px">JL FITNESS</div>
</div>
</body></html>
