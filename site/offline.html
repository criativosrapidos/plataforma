<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem internet · Criativos Rápidos</title>
<meta name="robots" content="noindex">
<style>
  :root { --y: #FFD400; --ink: #101216; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ink); color: #fff; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 24px; margin: 18px 0 6px; }
  p { color: #C9CAD0; margin: 0 0 22px; }
  button { background: var(--y); color: var(--ink); border: 0; border-radius: 12px; padding: 12px 20px; font: 700 15px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192.png" alt="">
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, seus conteúdos aparecem de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
